<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Crazy To-Do List with Tailwind CSS</title>
<link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
<style>
  .todo-item:hover {
    transform: rotate(360deg) scale(1.2);
    background-color: #fbbf24; /* Tailwind yellow-400 */
  }
</style>
</head>
<body class="flex justify-center items-center h-screen bg-gray-100">
  <ul id="todo-list" class="space-y-4">
    <li class="todo-item bg-white p-4 rounded-lg shadow-lg transition-transform duration-500 ease-in-out">Buy groceries</li>
    <li class="todo-item bg-white p-4 rounded-lg shadow-lg transition-transform duration-500 ease-in-out">Finish homework</li>
    <li class="todo-item bg-white p-4 rounded-lg shadow-lg transition-transform duration-500 ease-in-out">Clean the house</li>
    <li class="todo-item bg-white p-4 rounded-lg shadow-lg transition-transform duration-500 ease-in-out">Walk the dog</li>
  </ul>
</body>
</html>
